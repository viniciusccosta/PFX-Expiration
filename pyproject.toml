[project]
name = "pfx-expiration"
version = "0.1.0"
description = "Exibe informações sobre a validade dos certificados digitais instalados na máquina."
authors = [{ name = "Vinícius Costa", email = "viniciusccosta95@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "chardet>=5.1.0,<6.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "tabulate>=0.9.0,<1.0.0"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = ["pyinstaller>=6.22.3,<7.0.0", "pre-commit (>=4.7.0,<5.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
